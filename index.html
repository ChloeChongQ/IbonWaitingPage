
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="等候頁面" >
  <title>ibon演唱會售票系統等候頁面</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #E9689B;
      --pink-dark: #D94D87;
      --pink-light: #FFF0F6;
      --pink-soft: #F9DCE8;
      --text: #38313A;
      --muted: #958994;
      --white: #FFFFFF;
    }

    body {
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      min-height: 100vh;
      background: var(--pink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .page {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    /* 頂部品牌標識 */
    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    .brand img {
      width: 280px;
      height: auto;
      max-width: 100%;
      object-fit: contain;
    }

    .brand-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    /* 主要白色卡片 */
    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 36px 28px 30px;
      box-shadow: 0 18px 45px rgba(119, 24, 61, 0.15);
    }

    .status-tag {
      display: inline-block;
      background: var(--pink-light);
      color: var(--pink);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 30px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.5;
      font-weight: 750;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .description {
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
      margin-bottom: 30px;
    }

    /* 圓形等待動畫 */
    .loading-wrap {
      display: flex;
      justify-content: center;
      margin: 8px 0 26px;
    }

    .loading-circle {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: var(--pink-light);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .loading-circle::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 6px solid var(--pink-soft);
      border-top-color: var(--pink);
      border-right-color: var(--pink);
      border-radius: 50%;
      animation: spin 1.3s linear infinite;
    }

    .heart {
      font-size: 36px;
      color: var(--pink);
      line-height: 1;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 等候人數 */
    .note {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .queue-number {
      color: var(--pink);
      font-size: clamp(38px, 10vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
    }

    .people-unit {
      font-size: 17px;
      font-weight: 500;
    }

    /* 進度條 */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .progress-title {
      color: var(--text);
      font-weight: 600;
    }

    .progress-value {
      color: var(--pink);
      font-weight: 700;
    }

    .progress-track {
      height: 9px;
      width: 100%;
      background: var(--pink-soft);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 32%;
      background: linear-gradient(
        90deg,
        #F47BA7,
        var(--pink)
      );
      border-radius: inherit;
      transition: width 1s ease;
    }

    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      text-align: left;
      margin-top: 26px;
      padding: 14px;
      background: #FFF7FA;
      border-radius: 14px;
      color: #8A6B7A;
      font-size: 12px;
      line-height: 1.8;
    }

    .notice-icon {
      color: var(--pink);
      font-size: 12px;
      flex-shrink: 0;
    }

    .footer {
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      margin-top: 20px;
      line-height: 1.8;
    }

    /* 手機版 */
    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 30px 22px 24px;
        border-radius: 24px;
      }

      h1 {
        font-size: 21px;
      }

      .description {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="brand"><img src="ibon售票系統圖標.png" alt="ibon售票系統圖標"></div>

    <p class="brand-subtitle">
      MAMAMOO 2026 TAIPEI CONCERT TICKETING
    </p>

    <section class="card">

      <div class="status-tag">● 系統等候中</div>

      <h1>正在排隊進入網頁中</h1>

      <p class="description">
        請勿關閉或重新整理此頁面。<br>
        系統正在安排進入順序，請稍候。
      </p>

      <div class="loading-wrap">
        <div class="loading-circle">
          <span class="heart">♡</span>
        </div>
      </div>

      <p class="note">目前等候人數</p>

      <div class="queue-number">
        <span id="queueNumber">12,846</span>
        <span class="people-unit">人</span>
      </div>

      <p class="note"><br>預計進入時間</p>

      <div class="queue-number">
        <span id="queueTime">12</span>
        <span class="people-unit">點</span>
                <span id="queueTime">12</span>
        <span class="people-unit">分</span>
      </div>
      

      <p class="note">
        <br>您已進入購票等候序列
      </p>

      <div class="progress-header">
        <span class="progress-title">排隊進度</span>
        <span class="progress-value" id="progressText">
          32%
        </span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="模擬排隊進度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="32"
        id="progressTrack"
      >
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="notice">
        <span class="notice-icon">♡</span>
        <p>為確保購票流程順暢，請耐心等候。</p>
      </div>

    </section>

    <footer class="footer">ibon售票等候頁面</footer>
  </main>

</body>
</html>
